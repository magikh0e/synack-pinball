; SYN/ACK pinball for the CYD 3.5" (Sunton ESP32-3248S035R)
; Display: ST7796 320x480 portrait, touch XPT2046, both on HSPI. See README.md.

[platformio]
default_envs = esp32-3248s035r

[env:esp32-3248s035r]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ST7796 + XPT2046 driver. Pins are set explicitly in src/LGFX_CYD35.hpp.
lib_deps =
    lovyan03/LovyanGFX@^1.2.0

build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1

; 4 MB flash WROOM-32, no PSRAM on this board.
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; LCDwiki ES3C35P: ESP32-S3 (16 MB flash, 8 MB octal PSRAM), ST77922 320x480
; over quad SPI, capacitive multi-touch in the panel (I2C 0x55), ES8311 audio.
; See src/board_es3c35p.cpp.
;
; USB: the app talks over TinyUSB CDC (ARDUINO_USB_MODE=0), because the
; hardware-CDC path is silent on this board. It enumerates as its own COM
; port; uploading does a 1200-baud touch to drop into the ROM bootloader,
; which shows up as a different port, and PlatformIO waits for it.
[env:es3c35p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; the board manifest says USB_MODE=1 (hardware CDC); replace its flags
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    adafruit/Adafruit NeoPixel@^1.12.0
build_unflags = -std=gnu++11 -Os
build_flags =
    -std=gnu++17
    -O2
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_ES3C35P
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
